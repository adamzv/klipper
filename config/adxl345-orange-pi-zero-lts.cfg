# Optional ADXL345 resonance-measurement include for Orange Pi Zero LTS.
# Do not include this during normal printing unless the Linux MCU is installed,
# SPI is enabled, and the ADXL345 is connected.
#
# Orange Pi Zero 26-pin expansion header wiring:
#   ADXL345 VCC  -> pin 17, 3.3V
#   ADXL345 GND  -> pin 25, GND
#   ADXL345 SDO  -> pin 21, SPI1 MISO
#   ADXL345 SDA  -> pin 19, SPI1 MOSI
#   ADXL345 SCL  -> pin 23, SPI1 CLK
#   ADXL345 CS   -> pin 24, SPI1 CS
#
# The Orange Pi Zero 26-pin expansion header exposes SPI1. Enable it in
# Armbian with the spi-spidev overlay and param_spidev_spi_bus=1, then verify:
#   ls -l /dev/spidev*
# The expected device for the header wiring above is /dev/spidev1.0.
#
# Typical workflow:
# 1. Install/enable the Linux MCU service on the Orange Pi.
# 2. Enable SPI/spidev in Armbian and confirm /dev/spidev1.0 exists.
# 3. Include this file temporarily from printer.cfg.
# 4. Run ACCELEROMETER_QUERY, then MEASURE_AXES_NOISE.
# 5. Mount ADXL345 on toolhead and run INPUT_SHAPER_CSV_X.
# 6. Mount ADXL345 on bed and run INPUT_SHAPER_CSV_Y.
# 7. Copy /tmp/resonances_*.csv files to a faster machine for graph analysis.
# 8. Paste final measured [input_shaper] values into the printer config.

[mcu host]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: host:None
spi_bus: spidev1.0

[resonance_tester]
accel_chip: adxl345
probe_points:
    90, 90, 20

[gcode_macro INPUT_SHAPER_CSV_X]
description: Measure X resonance and write /tmp/resonances_x_*.csv for offline shaper analysis.
gcode:
    RESPOND TYPE=command MSG="Measuring X resonance for offline input-shaper analysis."
    TEST_RESONANCES AXIS=X OUTPUT=resonances {% if params.NAME is defined %}NAME={params.NAME}{% endif %} {% if params.POINT is defined %}POINT={params.POINT}{% endif %}
    RESPOND TYPE=command MSG="Copy /tmp/resonances_x_*.csv from the printer host and analyze it off-printer."

[gcode_macro INPUT_SHAPER_CSV_Y]
description: Measure Y resonance and write /tmp/resonances_y_*.csv for offline shaper analysis.
gcode:
    RESPOND TYPE=command MSG="Measuring Y resonance for offline input-shaper analysis."
    TEST_RESONANCES AXIS=Y OUTPUT=resonances {% if params.NAME is defined %}NAME={params.NAME}{% endif %} {% if params.POINT is defined %}POINT={params.POINT}{% endif %}
    RESPOND TYPE=command MSG="Copy /tmp/resonances_y_*.csv from the printer host and analyze it off-printer."
