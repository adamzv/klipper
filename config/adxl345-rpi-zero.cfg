# Optional ADXL345 resonance-measurement include for a Raspberry Pi Zero W.
# Do not include this during normal printing unless the Linux MCU is installed
# and the accelerometer is connected.
#
# Typical workflow:
# 1. Install/enable the Linux MCU service on the Pi.
# 2. Include this file temporarily from printer.cfg.
# 3. Run ACCELEROMETER_QUERY, then ACCELEROMETER_MEASURE or SHAPER_CALIBRATE.
# 4. Copy /tmp/adxl345-*.csv files to a faster machine for graph analysis.
# 5. Paste final measured [input_shaper] values into the printer config.

[mcu host]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: host:None
spi_bus: spidev0.0

[resonance_tester]
accel_chip: adxl345
probe_points:
    90, 90, 20
