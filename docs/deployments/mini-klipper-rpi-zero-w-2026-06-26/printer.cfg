[include mainsail.cfg]

# Prusa Mini+ Buddy board, Sherpa Mini direct drive, E3D Revo Micro/ObXidian.
# Based on config/printer-prusa-mini-plus-2020.cfg.
#
# This config is intended for Mainsail/Fluidd + OrcaSlicer workflows.
# Include Mainsail's standard macros from your deployed printer.cfg:
# [include mainsail.cfg]

[stepper_x]
step_pin: PD1
dir_pin: PD0
enable_pin: !PD3
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 180.4
position_min: -2
position_max: 180.4
homing_speed: 50
homing_retract_dist: 0

[stepper_y]
step_pin: PD13
dir_pin: PD12
enable_pin: !PD14
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -3
position_min: -3
position_max: 180
homing_speed: 50
homing_retract_dist: 0

[stepper_z]
step_pin: PD4
dir_pin: !PD15
enable_pin: !PD2
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_min: 0
position_max: 185

[extruder]
step_pin: PD9
dir_pin: !PD8
enable_pin: !PD10
microsteps: 16
# Derived from the existing Orca/Prusa start-gcode note: M92 E728.
# Recalibrate with Klipper's rotation_distance procedure after first motion.
rotation_distance: 4.3956
# Uncomment exactly one nozzle diameter to match the installed Revo nozzle.
#nozzle_diameter: 0.250
#nozzle_diameter: 0.400
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PB1
# E3D Revo heater cores use the Semitec 104NT thermistor family.
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PC0
control: pid
# Starting values from Prusa Mini defaults; PID tune the Revo on this printer.
pid_Kp: 7
pid_Ki: 0.5
pid_Kd: 45
min_temp: 10
max_temp: 305
max_extrude_only_distance: 350
pressure_advance: 0.042
pressure_advance_smooth_time: 0.040

[tmc2209 stepper_x]
uart_pin: PD5
uart_address: 1
diag_pin: ^PE2
driver_SGTHRS: 130
run_current: 0.35
sense_resistor: 0.22
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PD5
uart_address: 3
diag_pin: ^PE1
driver_SGTHRS: 130
run_current: 0.35
sense_resistor: 0.22
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: PD5
uart_address: 0
diag_pin: ^PE3
driver_SGTHRS: 100
run_current: 0.35
sense_resistor: 0.22
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: PD5
uart_address: 2
diag_pin: ^PA15
driver_SGTHRS: 100
run_current: 0.45
sense_resistor: 0.22

[heater_bed]
heater_pin: PB0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA4
control: pid
pid_Kp: 120
pid_Ki: 1.5
pid_Kd: 600
min_temp: 10
max_temp: 110

[heater_fan hotend_fan]
pin: PE9
tachometer_pin: PE14
fan_speed: 0.5

[fan]
pin: PE11
tachometer_pin: PE10

[probe]
pin: PA8
x_offset: -29
y_offset: -3
# Textured PLA baseline from Prusa Live Z -1.940, sign inverted for Klipper.
z_offset: 1.940
speed: 6.0

[safe_z_home]
home_xy_position: 147.4, 21.1
z_hop: 4

[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 141, 167
probe_count: 5, 5
algorithm: bicubic
fade_start: 1
fade_end: 10
adaptive_margin: 5

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_5B003A0013504B4D31383220-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 180
max_accel: 1250
max_z_velocity: 12
max_z_accel: 400

[exclude_object]

[gcode_arcs]
resolution: 0.1

# Stock Mini LCD/jogwheel support is experimental on a Pi Zero W host.
# Enable only after validating motion from Mainsail:
# [include prusa-mini-stock-lcd.cfg]

[gcode_macro SHEET_TEXTURED_PLA]
gcode:
    SET_GCODE_OFFSET Z=0 MOVE=1

[gcode_macro SHEET_TEXTURED_PETG]
gcode:
    SET_GCODE_OFFSET Z=0.05 MOVE=1

[gcode_macro SHEET_TEXTURED_TPU95]
gcode:
    SET_GCODE_OFFSET Z=0.10 MOVE=1

[gcode_macro SHEET_SMOOTH_PLA]
gcode:
    SET_GCODE_OFFSET Z=0.27 MOVE=1

[gcode_macro SHEET_SMOOTH_ASA]
gcode:
    SET_GCODE_OFFSET Z=0.39 MOVE=1

[gcode_macro SHEET_TEXTURED_WOODFILL]
gcode:
    RESPOND TYPE=command MSG="TEXTURED_WOODFILL Z offset is conservative; validate first layer."
    SET_GCODE_OFFSET Z=0.08 MOVE=1

[gcode_macro SHEET_SMOOTH_PETG]
gcode:
    RESPOND TYPE=command MSG="SMOOTH_PETG offset is a TODO; starting from smooth PLA."
    SET_GCODE_OFFSET Z=0.27 MOVE=1

[gcode_macro SHEET_PC]
gcode:
    RESPOND TYPE=command MSG="PC sheet/nozzle first-layer behavior is a TODO; validate before production prints."
    SET_GCODE_OFFSET Z=0 MOVE=1

[gcode_macro SHEET_PCCF]
gcode:
    RESPOND TYPE=command MSG="PCCF sheet/nozzle first-layer behavior is a TODO; validate before production prints."
    SET_GCODE_OFFSET Z=0 MOVE=1

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(215)|float %}
    {% set SHEET = params.SHEET|default("TEXTURED_PLA")|string|upper %}
    M220 S100
    M221 S100
    G90
    M83
    CLEAR_PAUSE
    SET_GCODE_OFFSET Z=0 MOVE=0
    M140 S{BED_TEMP}
    M104 S150
    M190 S{BED_TEMP}
    G28
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1
    {% if SHEET == "TEXTURED_PLA" %}
      SHEET_TEXTURED_PLA
    {% elif SHEET == "TEXTURED_PETG" %}
      SHEET_TEXTURED_PETG
    {% elif SHEET == "TEXTURED_TPU95" %}
      SHEET_TEXTURED_TPU95
    {% elif SHEET == "SMOOTH_PLA" %}
      SHEET_SMOOTH_PLA
    {% elif SHEET == "SMOOTH_ASA" %}
      SHEET_SMOOTH_ASA
    {% elif SHEET == "TEXTURED_WOODFILL" %}
      SHEET_TEXTURED_WOODFILL
    {% elif SHEET == "SMOOTH_PETG" %}
      SHEET_SMOOTH_PETG
    {% elif SHEET == "PC" %}
      SHEET_PC
    {% elif SHEET == "PCCF" %}
      SHEET_PCCF
    {% else %}
      RESPOND TYPE=command MSG="Unknown SHEET={SHEET}; using TEXTURED_PLA."
      SHEET_TEXTURED_PLA
    {% endif %}
    M109 S{EXTRUDER_TEMP}
    G92 E0
    G1 Z0.30 F600
    G1 X5 Y5 F6000
    G1 X120 E12 F800
    G1 Y7 F6000
    G1 X5 E12 F800
    G92 E0
    G1 Z2 F1200

[gcode_macro END_PRINT]
gcode:
    M400
    G92 E0
    G1 E-1.0 F1800
    G91
    G1 Z10 F1200
    G90
    G1 X5 Y170 F6000
    TURN_OFF_HEATERS
    M107
    BED_MESH_CLEAR
    M84

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    M107
    G91
    G1 Z10 F1200
    G90
    G1 X5 Y170 F6000
    CLEAR_PAUSE
    BASE_CANCEL_PRINT

[gcode_macro LOAD_FILAMENT]
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(215)|float %}
    M117 Loading filament
    M109 S{EXTRUDER_TEMP}
    M83
    G1 E20 F150
    G1 E150 F3000
    G1 E150 F3000
    G1 E30 F300
    G1 E10 F100
    G92 E0
    M400
    M104 S170
    M117 Filament loaded

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(215)|float %}
    M117 Unloading filament
    M109 S{EXTRUDER_TEMP}
    M83
    G1 E0.5 F1000
    G1 E-0.5 F1000
    G1 E1.0 F1000
    G1 E-1.0 F1000
    G1 E1.5 F1000
    G1 E-1.5 F1000
    G1 E2.0 F1000
    G1 E-50 F3000
    G1 E-150 F3000
    G1 E-150 F3000
    M400
    M104 S170
    M117 Remove filament

[gcode_macro PREHEAT_FILAMENT]
description: Preheat for a material preset. MATERIAL=PLA|PETG|FLEX|ASA|PC
gcode:
    {% set MATERIAL = params.MATERIAL|default("PLA")|string|upper %}
    {% if MATERIAL == "PLA" %}
      {% set NOZZLE = 215 %}
      {% set BED = 60 %}
    {% elif MATERIAL == "PETG" %}
      {% set NOZZLE = 230 %}
      {% set BED = 85 %}
    {% elif MATERIAL in ("FLEX", "TPU", "TPU95") %}
      {% set NOZZLE = 240 %}
      {% set BED = 50 %}
    {% elif MATERIAL == "ASA" %}
      {% set NOZZLE = 260 %}
      {% set BED = 100 %}
    {% elif MATERIAL == "PC" %}
      {% set NOZZLE = 275 %}
      {% set BED = 100 %}
    {% else %}
      {action_raise_error("Unknown MATERIAL='%s'. Use PLA, PETG, FLEX, ASA, or PC." % MATERIAL)}
    {% endif %}
    RESPOND TYPE=command MSG="Preheating {MATERIAL}: nozzle {NOZZLE}C, bed {BED}C"
    M104 S{NOZZLE}
    M140 S{BED}

[gcode_macro COOLDOWN]
description: Turn off heaters and fan.
gcode:
    TURN_OFF_HEATERS
    M107
    M117 Cooldown

[gcode_macro LOAD_FILAMENT_PLA]
description: Heat to PLA temperature and load filament.
gcode:
    LOAD_FILAMENT EXTRUDER_TEMP=215

[gcode_macro LOAD_FILAMENT_PETG]
description: Heat to PETG temperature and load filament.
gcode:
    LOAD_FILAMENT EXTRUDER_TEMP=230

[gcode_macro LOAD_FILAMENT_FLEX]
description: Heat to FLEX/TPU temperature and load filament.
gcode:
    LOAD_FILAMENT EXTRUDER_TEMP=240

[gcode_macro LOAD_FILAMENT_ASA]
description: Heat to ASA temperature and load filament.
gcode:
    LOAD_FILAMENT EXTRUDER_TEMP=260

[gcode_macro LOAD_FILAMENT_PC]
description: Heat to PC temperature and load filament.
gcode:
    LOAD_FILAMENT EXTRUDER_TEMP=275

[gcode_macro UNLOAD_FILAMENT_PLA]
description: Heat to PLA temperature and unload filament.
gcode:
    UNLOAD_FILAMENT EXTRUDER_TEMP=215

[gcode_macro UNLOAD_FILAMENT_PETG]
description: Heat to PETG temperature and unload filament.
gcode:
    UNLOAD_FILAMENT EXTRUDER_TEMP=230

[gcode_macro UNLOAD_FILAMENT_FLEX]
description: Heat to FLEX/TPU temperature and unload filament.
gcode:
    UNLOAD_FILAMENT EXTRUDER_TEMP=240

[gcode_macro UNLOAD_FILAMENT_ASA]
description: Heat to ASA temperature and unload filament.
gcode:
    UNLOAD_FILAMENT EXTRUDER_TEMP=260

[gcode_macro UNLOAD_FILAMENT_PC]
description: Heat to PC temperature and unload filament.
gcode:
    UNLOAD_FILAMENT EXTRUDER_TEMP=275
